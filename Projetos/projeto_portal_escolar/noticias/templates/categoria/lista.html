{% extends 'base.html' %}

{% block title %}Categorias - Portal Escolar{% endblock %}

{% block content %}
<h2>Categorias</h2>

<ul class="list-group">
    {% for categoria in categorias %}
    <a href="{% url 'noticias:categoria_detalhe' categoria.id %}">
      <li>
          {{ categoria.nome }}
      </li>
    </a>
    {% empty %}
    <p>Nenhuma categoria cadastrada.</p>
    {% endfor %}
</ul>
{% endblock %}
