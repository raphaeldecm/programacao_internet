{% extends 'base.html' %}

{% block title %}Confirmar Exclusão - Portal Escolar{% endblock %}

{% block content %}
<h2>Confirmar Exclusão</h2>
<p>Tem certeza de que deseja excluir a notícia: "{{ noticia.titulo }}"?</p>
<form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Excluir</button>
    <a href="{% url 'noticias:noticia_detalhe' noticia.id %}" class="btn btn-secondary">Cancelar</a>
</form>
{% endblock content %}
