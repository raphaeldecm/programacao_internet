{% extends 'base.html' %}

{% block title %}Tags - Portal Escolar{% endblock %}

{% block content %}
<h2>Tags</h2>

<ul class="list-group">
    {% for tag in tags %}
    <a href="{% url 'noticias:tag_detalhe' tag.id %}">
      <li>
          {{ tag.nome }}
      </li>
    </a>
    {% empty %}
    <p>Nenhuma tag cadastrada.</p>
    {% endfor %}
</ul>
{% endblock %}
